spring:
  application:
    name: stripe-clone

  datasource:
    url: jdbc:postgresql://localhost:5432/stripe_clone
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    # The ledger check scans every entry, so it is not part of the default health
    # response. Read it directly at /actuator/health/ledger, on a slow schedule.
    ledger:
      enabled: true

springdoc:
  api-docs:
    path: /v1/openapi.json
  swagger-ui:
    path: /docs

outbox:
  poll-interval-ms: 1000
  batch-size: 50
  max-attempts: 8
  base-backoff-seconds: 2

webhook:
  poll-interval-ms: 2000
  batch-size: 20
  max-attempts: 8
  base-backoff-seconds: 60
  request-timeout-seconds: 10

logging:
  level:
    root: INFO
    com.stripeclone: DEBUG
