services:
  postgres:
    image: postgres:16-alpine
    container_name: stripe-clone-postgres
    environment:
      POSTGRES_DB: stripe_clone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stripe_clone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
